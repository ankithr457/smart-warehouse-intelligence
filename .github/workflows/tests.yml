name: Python tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python src/run.py
      - run: python scripts/analyze.py
      - run: python scripts/build_powerbi.py
      - name: Check reproducible reports
        run: git diff --exit-code -- reports powerbi
